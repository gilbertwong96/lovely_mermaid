name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19"
            otp: "26"
          - elixir: "1.20"
            otp: "27"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - uses: actions/cache@v4
        with:
          path: ~/.mix/plts
          key: ${{ runner.os }}-plts-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.exs') }}

      - name: Fetch dependencies
        run: mix deps.get

      - name: Quality gates
        run: mix ci

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "27"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-1.20-27-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-1.20-27-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Generate coverage report
        env:
          MIX_ENV: test
        run: |
          mix test --cover > /tmp/cover.log 2>&1
          tail -6 /tmp/cover.log

      - name: Extract total coverage
        id: total
        run: |
          pct=$(grep '| Total' /tmp/cover.log | awk -F'|' '{gsub(/ /, "", $2); print $2}')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cover/

      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_PCT: ${{ steps.total.outputs.pct }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Coverage: **${process.env.COVERAGE_PCT}** (HTML report in the coverage-report artifact)`
            })
